[project]
name = "tkinter-icons-gmi"
version = "1.1.0"
description = "Google Material Icons (baseline/outlined/round/sharp/twotone) provider for tkinter-icons"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "tkinter-icons>=5.0.0"]

license = "MIT"

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"

# Auto-discovery hook for the base registry
[project.entry-points."tkinter_icons.providers"]
gmi = "tkinter_icons_gmi.provider:GoogleMaterialIconFontProvider"

[project.scripts]
tkicons-gmi-build = "tkinter_icons_gmi.tools.generate_assets:main"
tkicons-gmi-quick = "tkinter_icons_gmi.tools.generate_assets:default_main"

[tool.setuptools.package-data]
"tkinter_icons_gmi" = ["fonts/*.*", "glyphmap*.json", "metrics*.json", "LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"



