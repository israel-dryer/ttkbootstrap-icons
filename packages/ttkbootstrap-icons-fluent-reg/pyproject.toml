[project]
name = "ttkbootstrap-icons-fluent-reg"
version = "1.0.1"
description = "Fluent System Icons (Regular) for ttkbootstrap-icons (superseded - use tkinter-icons[fluent-regular])"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "ttkbootstrap-icons>=4.0.0,<5"]

license = "MIT"
classifiers = ["Development Status :: 7 - Inactive"]

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"
Documentation = "https://tkinter-icons.readthedocs.io/en/latest/packs/fluent-regular.html"
"Replacement package" = "https://pypi.org/project/tkinter-icons/"

# Auto-discovery hook for your base registry
[project.entry-points."ttkbootstrap_icons.providers"]
fluent-regular = "ttkbootstrap_icons_fluent_reg.provider:FluentRegularFontProvider"

[tool.setuptools.package-data]
"ttkbootstrap_icons_fluent_reg" = ["fonts/*.ttf", "glyphmap*.json", "LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"