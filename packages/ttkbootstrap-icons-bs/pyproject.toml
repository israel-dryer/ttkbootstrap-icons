[project]
name = "ttkbootstrap-icons-bs"
version = "1.0.1"
description = "Bootstrap Icons for ttkbootstrap-icons (superseded - use tkinter-icons[bootstrap])"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "ttkbootstrap-icons>=4.0.0,<5"]

# Bootstrap Icons licensing:
# - MIT License
license = "MIT"
classifiers = ["Development Status :: 7 - Inactive"]

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"
Documentation = "https://tkinter-icons.readthedocs.io/en/latest/packs/bootstrap.html"
"Replacement package" = "https://pypi.org/project/tkinter-icons/"

# Auto-discovery hook for your base registry
[project.entry-points."ttkbootstrap_icons.providers"]
bootstrap = "ttkbootstrap_icons_bs.provider:BootstrapFontProvider"

[tool.setuptools.package-data]
"ttkbootstrap_icons_bs" = ["assets/*.ttf", "assets/*.json"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
