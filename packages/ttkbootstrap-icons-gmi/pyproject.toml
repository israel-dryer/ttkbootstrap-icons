[project]
name = "ttkbootstrap-icons-gmi"
version = "1.0.2"
description = "Google Material Icons for ttkbootstrap-icons (superseded - use tkinter-icons[google-material])"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "ttkbootstrap-icons>=3.0.0,<5"]

license = "MIT"
classifiers = ["Development Status :: 7 - Inactive"]

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"
Documentation = "https://tkinter-icons.readthedocs.io/en/latest/packs/google-material.html"
"Replacement package" = "https://pypi.org/project/tkinter-icons/"

# Auto-discovery hook for the base registry
[project.entry-points."ttkbootstrap_icons.providers"]
gmi = "ttkbootstrap_icons_gmi.provider:GoogleMaterialIconFontProvider"

[project.scripts]
ttkicons-gmi-build = "ttkbootstrap_icons_gmi.tools.generate_assets:main"
ttkicons-gmi-quick = "ttkbootstrap_icons_gmi.tools.generate_assets:default_main"

[tool.setuptools.package-data]
"ttkbootstrap_icons_gmi" = ["fonts/*.*", "glyphmap*.json", "LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"



