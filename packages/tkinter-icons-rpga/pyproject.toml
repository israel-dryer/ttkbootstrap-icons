[project]
name = "tkinter-icons-rpga"
version = "1.1.0"
description = "RPG Awesome (font-based) provider for tkinter-icons"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "tkinter-icons>=5.0.0"]

license = "MIT"

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"

# Auto-discovery hook for the base registry
[project.entry-points."tkinter_icons.providers"]
rpga = "tkinter_icons_rpga.provider:RPGAFontProvider"

[project.scripts]
tkicons-rpga-build = "tkinter_icons_rpga.tools.generate_assets:main"
tkicons-rpga-quick = "tkinter_icons_rpga.tools.generate_assets:default_main"

[tool.setuptools.package-data]
"tkinter_icons_rpga" = ["fonts/*.ttf", "glyphmap*.json", "metrics*.json", "LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

