[project]
name = "ttkbootstrap-icons-mat"
version = "1.0.1"
description = "Material Design Icons for ttkbootstrap-icons (superseded - use tkinter-icons[material])"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "ttkbootstrap-icons>=3.0.0,<5"]

license = "MIT"
classifiers = ["Development Status :: 7 - Inactive"]

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"
Documentation = "https://tkinter-icons.readthedocs.io/en/latest/packs/material.html"
"Replacement package" = "https://pypi.org/project/tkinter-icons/"

# Auto-discovery hook for your base registry
[project.entry-points."ttkbootstrap_icons.providers"]
mat = "ttkbootstrap_icons_mat.provider:MaterialDesignFontProvider"

[project.scripts]
ttkicons-mat-build = "ttkbootstrap_icons_mat.tools.generate_assets:main"
ttkicons-mat-quick = "ttkbootstrap_icons_mat.tools.generate_assets:default_main"

[tool.setuptools.package-data]
"ttkbootstrap_icons_mat" = ["fonts/*.ttf", "glyphmap.json", "LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


