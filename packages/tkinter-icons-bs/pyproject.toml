[project]
name = "tkinter-icons-bs"
version = "1.1.1"
description = "Bootstrap Icons — an icon pack for tkinter-icons"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "tkinter-icons>=5.0.0"]

# Bootstrap Icons licensing:
# - MIT License
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"

# Auto-discovery hook for your base registry
[project.entry-points."tkinter_icons.providers"]
bootstrap = "tkinter_icons_bs.provider:BootstrapFontProvider"

[tool.setuptools.package-data]
"tkinter_icons_bs" = ["assets/*.ttf", "assets/*.json", "assets/LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
