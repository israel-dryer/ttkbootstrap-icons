[project]
name = "tkinter-icons-simple"
version = "1.1.0"
description = "Simple Icons (font-based) provider for tkinter-icons"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "tkinter-icons>=5.0.0"]

license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"

# Auto-discovery hook for your base registry
[project.entry-points."tkinter_icons.providers"]
simple = "tkinter_icons_simple.provider:SimpleFontProvider"

[project.scripts]
tkicons-simple-build = "tkinter_icons_simple.tools.generate_assets:main"
tkicons-simple-quick = "tkinter_icons_simple.tools.generate_assets:default_main"

[tool.setuptools.package-data]
"tkinter_icons_simple" = ["fonts/*.ttf", "glyphmap*.json", "metrics*.json", "LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


