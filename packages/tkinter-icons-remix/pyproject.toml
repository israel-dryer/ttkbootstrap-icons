[project]
name = "tkinter-icons-remix"
version = "1.1.0"
description = "Remix Icons (font-based) provider for tkinter-icons"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Israel Dryer" }]
dependencies = ["Pillow>=9.1", "tkinter-icons>=5.0.0"]

license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/israel-dryer/tkinter-icons"

# Auto-discovery hook for your base registry
[project.entry-points."tkinter_icons.providers"]
remix = "tkinter_icons_remix.provider:RemixFontProvider"

[tool.setuptools.package-data]
"tkinter_icons_remix" = ["fonts/*.ttf", "glyphmap*.json", "metrics*.json", "LICENSES/*"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
# `tools` regenerates this pack's assets from upstream sources and is useless
# from an installed wheel. Excluding it keeps `tkinter_icons_*.tools` from
# becoming a public import path we would owe compatibility on after 5.0.0.
# The maintainer workflow runs against an editable checkout, where it is on disk.
exclude = ["*.tools", "*.tools.*"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


