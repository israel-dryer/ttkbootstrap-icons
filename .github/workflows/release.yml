name: Release

# One tag releases the repository.
#
#   v5.0.0  ->  every distribution under packages/ that is not already on PyPI
#
# This is a monorepo and the tag names the repository's release, not one
# package's. The base package is bumped for every release and carries the
# change; the seventeen others ride along on the versions their pyprojects
# declare, and anything already published is skipped at upload.
#
# There was briefly one tag per distribution. It meant eighteen tags and
# eighteen GitHub Releases for a single coordinated release — each one a
# notification to anyone watching releases — and it left the publish order as a
# procedure a human had to get right, which RELEASE.md had to warn about in
# bold. The order is enforced here now, in the one place it cannot be
# forgotten. No per-distribution tag was ever pushed, so nothing is orphaned.

on:
  push:
    tags:
      - "v*"

  # Dry run. Everything up to publishing, and nothing after it: the `publish`
  # and `release` jobs are gated on this being a tag push. Use it to exercise
  # the whole path before creating a tag, because the first real run of this
  # workflow ends in uploads that PyPI will not let you take back.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build as, e.g. v5.0.0"
        required: true
      ref:
        description: "Ref to build from (default: the branch selected above)"
        required: false

jobs:
  build:
    name: Verify and build every distribution
    runs-on: ubuntu-latest
    env:
      # On a tag push this is the tag. On a dry run it is whatever tag was
      # named, which need not exist yet.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      title: ${{ steps.notes.outputs.title }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The base package's version comes from the tag through
          # setuptools-scm, which needs the whole tag history to find it.
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `icon.py` imports tkinter at module scope, so importing the library at
      # all needs it - see #91. The metrics check below renders through Pillow
      # and needs no display.
      - name: Install Tk
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # --no-deps for the packs, deliberately. Each pins `tkinter-icons>=5.0.0`,
      # and the editable base installed just above reports whatever the tag
      # history says, which before the tag exists is below the floor - so pip
      # would go to PyPI for a base package that is already here. Their only
      # other dependency is Pillow, which the base install brings in.
      # `verify_packages.py` checks the floors statically, so skipping them
      # here loses no coverage.
      - name: Install the base package and every pack
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e packages/tkinter-icons
          python -m pip install --no-deps $(printf -- '-e %s ' packages/tkinter-icons-*/)
          python -m pip install --no-deps -e packages/ttkbootstrap-icons-shim

      - name: Resolve the tag
        id: resolve
        run: python .github/scripts/packages.py "$RELEASE_TAG" "$GITHUB_OUTPUT"

      # --strict, unlike CI, and every distribution rather than one. Everything
      # CI tolerates as a warning is a release blocker: a pack shipped without
      # generated metrics silently falls back to the miscentering 5.0.0 exists
      # to fix, and a pack shipped without its upstream license file is a
      # compliance problem. Anything unchecked here is something the publish
      # job could still upload.
      - name: Preflight
        run: python .github/scripts/verify_packages.py --strict --imports --tag "$RELEASE_TAG"

      # Metrics are committed, so they can drift from the font that produced
      # them. This re-measures and compares. Every pack, because a release can
      # publish any of them.
      - name: Check every pack's glyph metrics are current
        run: python -m tkinter_icons.tools.generate_metrics --all --check

      # Staged into three directories because the upload order below is
      # load-bearing and `gh-action-pypi-publish` takes a directory.
      - name: Build every distribution
        run: |
          for directory in packages/tkinter-icons-*/; do
            python -m build --outdir dist/packs "$directory"
          done
          python -m build --outdir dist/base packages/tkinter-icons
          python -m build --outdir dist/shim packages/ttkbootstrap-icons-shim
          echo "built $(ls dist/packs dist/base dist/shim | grep -c '\.whl$') wheels"

      - name: Check the built metadata
        run: python -m twine check dist/*/*

      # The tag drives the base package's version through setuptools-scm, so a
      # misconfiguration there produces a correctly-named tag on a wrongly
      # numbered wheel. Catch that here rather than on PyPI, where the version
      # cannot be reused.
      #
      # On a dry run this is a warning rather than a failure: a dry run is
      # checked out at a branch, not at the tag, so the base package's
      # setuptools-scm version legitimately will not match a tag that does not
      # exist yet. Nothing is lost - the seventeen packages with a static
      # version are compared against their changelogs by the preflight above,
      # and that is a hard error there.
      - name: Confirm the base wheel matches the tag
        run: |
          expected="${{ steps.resolve.outputs.version }}"
          built=$(basename dist/base/*.whl | cut -d- -f2)
          if [ "$built" != "$expected" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::warning::built $built, tag names $expected. Expected on a dry run unless $RELEASE_TAG exists at the ref being built."
            else
              echo "::error::tag names $expected but the base wheel is $built"
              exit 1
            fi
          else
            echo "built $expected, as tagged"
          fi

      - name: Extract the release title and notes from the changelog
        id: notes
        run: |
          # No distribution-name prefix: one tag releases the whole repository
          # (#97), so there is exactly one release per version and the prefix
          # only stutters against a heading that names the project.
          python .github/scripts/release_notes.py \
            CHANGELOG.md \
            "${{ steps.resolve.outputs.version }}" \
            RELEASE_NOTES.md "$GITHUB_OUTPUT"
          if [ -s RELEASE_NOTES.md ]; then
            echo "Using curated notes ($(wc -l < RELEASE_NOTES.md) lines)."
          else
            echo "No changelog section; falling back to auto-generated notes."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            RELEASE_NOTES.md

  publish:
    name: Publish to PyPI
    needs: build
    # A tag push only. This is what makes workflow_dispatch a dry run, so it is
    # the one condition in this file that must not be relaxed.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC token instead of an
    # API token, so nothing has to be stored here. Each of the eighteen PyPI
    # projects needs a publisher configured for this repository, this workflow
    # file, and this environment name — see RELEASE.md.
    environment:
      name: pypi
      url: https://pypi.org/p/tkinter-icons
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      # Order is why these are three steps rather than one upload of `dist/`.
      # The base package's extras pin `>=1.1.0` against the packs, so a base
      # published before them points at versions PyPI does not have yet and
      # `pip install "tkinter-icons[material]"` fails for everyone who tries it
      # in the window. This used to be a human pushing eighteen tags in the
      # right order; it is three ordered steps now.
      #
      # `skip-existing` on the packs and the shim, not on the base. A release
      # bumps the base every time, so a base version already on PyPI means the
      # tag is wrong and failing is correct. The packs move independently and
      # most will be unchanged, and the shim is published once and never again -
      # for those, already-published is the normal case rather than an error.
      - name: Publish the packs
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/packs
          skip-existing: true

      - name: Publish tkinter-icons
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/base

      - name: Publish the ttkbootstrap-icons shim
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/shim
          skip-existing: true

  release:
    name: Create the GitHub Release
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      # One release per tag, titled from the root changelog. The per-package
      # changelogs are still the record for a pack's own history; they are
      # linked from the packs page rather than broadcast as eighteen separate
      # releases.
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.build.outputs.title }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, 'a') || contains(needs.build.outputs.version, 'b') || contains(needs.build.outputs.version, 'rc') }}
          files: dist/*/*
