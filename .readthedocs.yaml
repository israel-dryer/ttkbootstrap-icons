# Read the Docs build, matching ttkbootstrap's so the family builds the same way.
#
# No `apt_packages: [python3-tk]` here, and none is needed: ttkbootstrap imports
# `tkinter`, `tkinter.font`, and `tkinter.ttk` at module scope, mocks nothing,
# lists no apt packages, and publishes to Read the Docs today. Their image ships
# a Python with `_tkinter`.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Read the Docs clones shallow and without tags. The base package takes its
    # version from setuptools-scm, and `fallback_version` was deliberately
    # removed (see CLAUDE.md) so that a build which cannot see the tags fails
    # loudly rather than silently numbering itself. Without this the docs build
    # is exactly that kind of build.
    post_checkout:
      - git fetch --unshallow || true
      - git fetch --tags || true

    # Every pack, not just a couple. `packs-table` and `pack_showcase` read each
    # set's styles, upstream version, and glyph count from the *installed*
    # provider and render its preview glyphs with the real font, so a partial
    # install publishes a table with holes and a page with missing strips.
    # `fail_on_warning` below turns that into a failed build rather than a bad
    # page, which is why this step is not optional.
    #
    # `--no-deps` because each pack floors on `tkinter-icons>=5.0.0`, and the
    # source checkout reports a dev version below that until the release tag
    # exists — without it pip goes to PyPI looking for one that satisfies it.
    post_install:
      - python -m pip install --no-deps packages/tkinter-icons-*/

sphinx:
  configuration: docs/conf.py
  # The docs are maintained warning-clean (built locally with `-W -n`); enforce
  # it here too, so a broken cross-reference or an unreadable pack fails the
  # build — including PR previews — instead of publishing silently.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: packages/tkinter-icons
    - requirements: docs/requirements.txt
